:root {
  --primary: #667eea;
  --primary-dark: #5a67d8;
  --secondary: #764ba2;
  --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --gradient-soft: linear-gradient(135deg, rgba(102,126,234,0.12) 0%, rgba(118,75,162,0.12) 100%);
  --bg: #f0f2ff;
  --text: #2d3748;
  --text2: #718096;
  --card: rgba(255,255,255,0.72);
  --card-border: rgba(255,255,255,0.8);
  --card-shadow: 0 20px 60px rgba(102,126,234,0.15), 0 8px 24px rgba(118,75,162,0.1);
  --input-bg: rgba(255,255,255,0.92);
  --input-border: rgba(102,126,234,0.2);
  --result-bg: rgba(255,255,255,0.85);
  --result-border: rgba(102,126,234,0.15);
  --toast-bg: rgba(255,255,255,0.96);
  --dd-bg: rgba(255,255,255,0.96);
  --tr: 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg: #0f0f1a;
  --text: #e2e8f0;
  --text2: #a0aec0;
  --card: rgba(20,20,40,0.78);
  --card-border: rgba(255,255,255,0.08);
  --card-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 8px 24px rgba(102,126,234,0.2);
  --input-bg: rgba(20,20,40,0.92);
  --input-border: rgba(102,126,234,0.3);
  --result-bg: rgba(20,20,40,0.85);
  --result-border: rgba(102,126,234,0.25);
  --toast-bg: rgba(20,20,40,0.96);
  --dd-bg: rgba(20,20,40,0.96);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--tr),color var(--tr);overflow-x:hidden}

.bg-blob{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none}
.bg-blob::before,.bg-blob::after{content:'';position:absolute;border-radius:50%;filter:blur(100px);opacity:0.5;animation:blob 20s ease-in-out infinite}
.bg-blob::before{width:600px;height:600px;background:radial-gradient(circle,rgba(102,126,234,0.3),transparent 70%);top:-200px;left:-100px}
.bg-blob::after{width:500px;height:500px;background:radial-gradient(circle,rgba(118,75,162,0.25),transparent 70%);bottom:-150px;right:-100px;animation-delay:-10s}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-30px) scale(1.1)}50%{transform:translate(-20px,40px) scale(0.95)}75%{transform:translate(30px,20px) scale(1.05)}}

.topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 24px;position:relative;z-index:100}

.lang-wrap{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--card-border);border-radius:12px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:var(--tr);font-family:inherit}
.lang-btn:hover{background:var(--gradient-soft);border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,0.2)}

.lang-dd{position:absolute;top:calc(100% + 8px);right:0;min-width:180px;background:var(--dd-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--card-border);border-radius:12px;padding:6px;opacity:0;visibility:hidden;transform:translateY(-10px);transition:var(--tr);z-index:200;box-shadow:0 10px 40px rgba(0,0,0,0.15)}
.lang-dd.open{opacity:1;visibility:visible;transform:translateY(0)}

.lang-opt{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;background:transparent;border-radius:8px;font-size:14px;color:var(--text);cursor:pointer;transition:var(--tr);font-family:inherit;text-align:left}
.lang-opt:hover{background:var(--gradient-soft)}
.lang-opt.active{background:var(--gradient);color:#fff;font-weight:600}
.lang-opt.active:hover{background:var(--gradient)}

.theme-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--card-border);border-radius:12px;color:var(--text);cursor:pointer;transition:var(--tr);font-size:18px}
.theme-btn:hover{background:var(--gradient-soft);border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,0.2)}

.main-wrap{display:flex;align-items:center;justify-content:center;padding:20px;min-height:calc(100vh - 72px)}

.card{position:relative;width:100%;max-width:520px;background:var(--card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--card-border);border-radius:24px;padding:40px 32px;box-shadow:var(--card-shadow);animation:cardIn 0.6s ease-out;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gradient)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.logo-box{display:flex;flex-direction:column;align-items:center;margin-bottom:20px}
.logo-icon{width:64px;height:64px;background:var(--gradient);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:28px;color:#fff;box-shadow:0 8px 24px rgba(102,126,234,0.35);animation:logoGlow 3s ease-in-out infinite}
@keyframes logoGlow{0%,100%{box-shadow:0 8px 24px rgba(102,126,234,0.35)}50%{box-shadow:0 8px 36px rgba(102,126,234,0.55)}}
.logo-name{font-size:28px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px}

.card-h{font-size:22px;font-weight:700;text-align:center;margin-bottom:8px;color:var(--text);line-height:1.3}
.card-sub{font-size:14px;text-align:center;color:var(--text2);margin-bottom:28px;line-height:1.5}

.input-wrap{position:relative;margin-bottom:20px}
.url-input{width:100%;padding:16px 48px 16px 20px;background:var(--input-bg);border:2px solid var(--input-border);border-radius:14px;font-size:15px;font-family:inherit;color:var(--text);transition:var(--tr);outline:none}
.url-input::placeholder{color:var(--text2)}
.url-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(102,126,234,0.12)}
.input-ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:18px;pointer-events:none}

.gen-btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 24px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit;background:var(--gradient);color:#fff;box-shadow:0 6px 20px rgba(102,126,234,0.35)}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(102,126,234,0.45)}
.gen-btn:active{transform:translateY(0)}

.ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.4);transform:scale(0);animation:rip 0.6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.result-area{display:none;margin-top:24px;animation:resultIn 0.5s ease-out}
.result-area.show{display:block}
@keyframes resultIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.divider{height:1px;background:var(--gradient-soft);margin-bottom:20px;border-radius:1px}

.r-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:8px}
.r-url-box{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.r-url{flex:1;padding:12px 16px;background:var(--input-bg);border:1px solid var(--result-border);border-radius:10px;font-size:14px;word-break:break-all}
.r-url a{color:var(--primary);text-decoration:none;transition:var(--tr)}
.r-url a:hover{color:var(--primary-dark);text-decoration:underline}

.btn-copy{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--gradient);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit;white-space:nowrap;position:relative;overflow:hidden}
.btn-copy:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,0.3)}
.btn-copy.done{background:linear-gradient(135deg,#48bb78,#38a169)}

.qr-wrap{display:flex;flex-direction:column;align-items:center;margin:20px 0;padding:20px;background:var(--result-bg);border:1px solid var(--result-border);border-radius:16px}
.qr-img{width:200px;height:200px;border-radius:8px}

.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn-dl{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--input-bg);color:var(--text);border:1px solid var(--result-border);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit}
.btn-dl:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,0.15)}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;visibility:hidden;transition:var(--tr)}
.overlay.show{opacity:1;visibility:visible}
.spinner{width:48px;height:48px;border:4px solid var(--input-border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 24px;background:var(--toast-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--card-border);border-radius:12px;font-size:14px;font-weight:500;color:var(--text);box-shadow:0 8px 30px rgba(0,0,0,0.12);z-index:1000;opacity:0;transition:all 0.4s cubic-bezier(0.4,0,0.2,1)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-left:4px solid #48bb78}
.toast.err{border-left:4px solid #e53e3e}

.footer{text-align:center;padding:16px;font-size:13px;color:var(--text2)}

@media(max-width:600px){
  .card{padding:28px 20px;margin:10px}
  .logo-icon{width:52px;height:52px;font-size:22px;border-radius:14px}
  .logo-name{font-size:24px}
  .card-h{font-size:18px}
  .topbar{padding:12px 16px}
  .qr-img{width:160px;height:160px}
  .actions{flex-direction:column;align-items:stretch}
}
</style>
</head>

// APP STATE

let currentLang = 'vi';
let shortCode = '';

// ============================================================
// ROUTER: Check short code -> redirect
// ============================================================
(function(){
  var path = location.pathname.substring(1);
  if(path && path.length >= 4 && path.length <= 10 && !path.includes('.')){
    try{
      var store = JSON.parse(localStorage.getItem('ls_urls')||'{}');
      if(store[path]){
        window.location.replace(store[path]);
        return;
      }
    }catch(e){}
  }
})();

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  // Update lang button
  var info = LANG_LIST.find(function(l){return l.code===currentLang});
  if(info){
    document.getElementById('langFlag').textContent = info.flag;
    document.getElementById('langName').textContent = info.name;
  }
}

function renderLangOptions(){
  var dd = document.getElementById('langDd');
  dd.innerHTML = '';
  LANG_LIST.forEach(function(l){
    var btn = document.createElement('button');
    btn.className = 'lang-opt' + (l.code===currentLang?' active':'');
    btn.innerHTML = '<span>'+l.flag+'</span><span>'+l.name+'</span>';
    btn.addEventListener('click',function(){
      currentLang = l.code;
      localStorage.setItem('ls_lang',currentLang);
      applyLang();
      renderLangOptions();
      closeLangDd();
    });
    dd.appendChild(btn);
  });
}

function openLangDd(){ document.getElementById('langDd').classList.add('open'); }
function closeLangDd(){ document.getElementById('langDd').classList.remove('open'); }

function initLang(){
  var stored = localStorage.getItem('ls_lang');
  var browser = navigator.language.substring(0,2);
  if(stored && LANGS[stored]){ currentLang = stored; }
  else if(LANGS[browser]){ currentLang = browser; localStorage.setItem('ls_lang',currentLang); }
  else{ currentLang = 'vi'; localStorage.setItem('ls_lang',currentLang); }
  applyLang();
  renderLangOptions();
}

// ============================================================
// THEME SYSTEM
// ============================================================
function initTheme(){
  var stored = localStorage.getItem('ls_theme');
  if(stored==='dark') document.documentElement.setAttribute('data-theme','dark');
  updateThemeIcon();
}

function toggleTheme(){
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme', isDark?'light':'dark');
  localStorage.setItem('ls_theme', isDark?'light':'dark');
  updateThemeIcon();
}

function updateThemeIcon(){
  var ico = document.getElementById('themeIco');
  var isDark = document.documentElement.getAttribute('data-theme')==='dark';
  ico.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type==='ok'?'ok':'err');
  setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

// ============================================================
// RIPPLE EFFECT
// ============================================================
document.addEventListener('click', function(e){
  var btn = e.target.closest('.gen-btn, .btn-copy');
  if(!btn) return;
  var ripple = document.createElement('span');
  ripple.className = 'ripple-el';
  var rect = btn.getBoundingClientRect();
  var size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size+'px';
  ripple.style.left = (e.clientX - rect.left - size/2)+'px';
  ripple.style.top = (e.clientY - rect.top - size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(function(){ ripple.remove(); }, 600);
});

// ============================================================
// QR CODE GENERATOR (using qrcode.js library)
// ============================================================
function generateQR(containerEl, text){
  // Clear previous
  containerEl.innerHTML = '';
  try{
    new QRCode(containerEl, {
      text: text,
      width: 256,
      height: 256,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  }catch(e){
    console.error('QR generation failed:', e);
  }
}

function getQRDataURL(containerEl){
  var canvas = containerEl.querySelector('canvas');
  if(canvas) return canvas.toDataURL('image/png');
  var img = containerEl.querySelector('img');
  if(img && img.src) return img.src;
  return null;
}

function downloadPNG(text, filename){
  var temp = document.createElement('div');
  temp.style.display = 'none';
  document.body.appendChild(temp);
  new QRCode(temp, {
    text: text,
    width: 1024,
    height: 1024,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  setTimeout(function(){
    var canvas = temp.querySelector('canvas');
    var img = temp.querySelector('img');
    var dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
    if(dataUrl){
      var a = document.createElement('a');
      a.download = filename + '.png';
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    document.body.removeChild(temp);
  }, 500);
}

function downloadSVG(text, filename){
  // Generate SVG manually from QR matrix
  var temp = document.createElement('div');
  temp.style.display = 'none';
  document.body.appendChild(temp);
  new QRCode(temp, {
    text: text,
    width: 512,
    height: 512,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  setTimeout(function(){
    var canvas = temp.querySelector('canvas');
    if(canvas){
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var size = Math.floor(w / 41); // approximate module size
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+w+'" width="1024" height="1024">';
      svg += '<rect width="'+w+'" height="'+w+'" fill="#ffffff"/>';
      for(var y = 0; y < w; y += size){
        for(var x = 0; x < w; x += size){
          var px = ctx.getImageData(x+1, y+1, 1, 1).data;
          if(px[0] < 128){
            svg += '<rect x="'+x+'" y="'+y+'" width="'+size+'" height="'+size+'" fill="#000000"/>';
          }
        }
      }
      svg += '</svg>';
      var blob = new Blob([svg], {type:'image/svg+xml'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.download = filename + '.svg';
      a.href = url;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    document.body.removeChild(temp);
  }, 500);
}

// ============================================================
// COPY HELPER
// ============================================================
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast(t('toast_copied'),'ok'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(t('toast_copied'),'ok');
  }
}

// ============================================================
// VALIDATION
// ============================================================
function validURL(url){
  try{
    var p = new URL(url);
    return p.protocol==='http:' || p.protocol==='https:';
  }catch(e){ return false; }
}

function escHtml(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
// CODE GENERATOR
// ============================================================
function makeCode(){
  var c = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var r = '';
  for(var i=0;i<6;i++) r += c[Math.floor(Math.random()*c.length)];
  return r;
}

// ============================================================
// MAIN PROCESS
// ============================================================
function process(){
  var input = document.getElementById('urlIn');
  var url = input.value.trim();

  if(!url){ showToast(t('toast_empty'),'err'); return; }
  if(!validURL(url)){ showToast(t('toast_bad'),'err'); return; }

  // Show loading
  document.getElementById('overlay').classList.add('show');

  // Generate unique code
  var store = JSON.parse(localStorage.getItem('ls_urls')||'{}');
  var code = makeCode();
  while(store[code]) code = makeCode();
  store[code] = url;
  localStorage.setItem('ls_urls', JSON.stringify(store));
  shortCode = code;

  // Build short URL
  var shortUrl = location.origin + '/' + code;

  // Simulate brief processing delay
  setTimeout(function(){
    document.getElementById('overlay').classList.remove('show');
    showResult(url, shortUrl);
  }, 500);
}

function showResult(originalUrl, shortUrl){
  var area = document.getElementById('resultArea');
  var html = '<div class="divider"></div>';
  html += '<div class="r-label">'+t('r_short')+'</div>';
  html += '<div class="r-url-box">';
  html += '<div class="r-url"><a href="'+escHtml(shortUrl)+'" target="_blank" rel="noopener">'+escHtml(shortUrl)+'</a></div>';
  html += '<button class="btn-copy" onclick="copyText(\''+escHtml(shortUrl)+'\')"><i class="fas fa-copy"></i> '+t('btn_copy')+'</button>';
  html += '</div>';

  // QR Code display
  html += '<div class="qr-wrap"><div id="qrDisplay"></div></div>';

  // Action buttons
  html += '<div class="actions">';
  html += '<button class="btn-copy" onclick="copyText(\''+escHtml(shortUrl)+'\')"><i class="fas fa-copy"></i> '+t('btn_copy')+'</button>';
  html += '<button class="btn-dl" onclick="downloadPNG(\''+escHtml(shortUrl)+'\',\'qrcode\')"><i class="fas fa-download"></i> '+t('btn_dl_png')+'</button>';
  html += '<button class="btn-dl" onclick="downloadSVG(\''+escHtml(shortUrl)+'\',\'qrcode\')"><i class="fas fa-download"></i> '+t('btn_dl_svg')+'</button>';
  html += '</div>';

  area.innerHTML = html;
  area.classList.add('show');

  // Render QR
  var qrContainer = document.getElementById('qrDisplay');
  generateQR(qrContainer, shortUrl);

  // Smooth scroll to result
  setTimeout(function(){ area.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 100);
}

// ============================================================
// EVENT BINDINGS
// ============================================================
document.getElementById('genBtn').addEventListener('click', process);
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('langBtn').addEventListener('click', function(e){
  e.stopPropagation();
  var dd = document.getElementById('langDd');
  dd.classList.contains('open') ? closeLangDd() : openLangDd();
});
document.addEventListener('click', function(e){
  var dd = document.getElementById('langDd');
  var btn = document.getElementById('langBtn');
  if(!dd.contains(e.target) && !btn.contains(e.target)) closeLangDd();
});
document.getElementById('urlIn').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); process(); }
});

// ============================================================
// INIT
// ============================================================
initLang();
initTheme();
</script>
