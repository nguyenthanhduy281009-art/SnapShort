    <style>
:root {
  --primary: #667eea;
  --primary-dark: #5a67d8;
  --secondary: #764ba2;
  --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --gradient-soft: linear-gradient(135deg, rgba(102,126,234,0.15) 0%, rgba(118,75,162,0.15) 100%);
  --bg-color: #f0f2ff;
  --text-color: #2d3748;
  --text-muted: #718096;
  --card-bg: rgba(255, 255, 255, 0.72);
  --card-border: rgba(255, 255, 255, 0.8);
  --card-shadow: 0 20px 60px rgba(102, 126, 234, 0.15), 0 8px 24px rgba(118, 75, 162, 0.1);
  --input-bg: rgba(255, 255, 255, 0.9);
  --input-border: rgba(102, 126, 234, 0.2);
  --btn-text: #ffffff;
  --result-bg: rgba(255, 255, 255, 0.85);
  --result-border: rgba(102, 126, 234, 0.15);
  --overlay-bg: rgba(255, 255, 255, 0.5);
  --toast-bg: rgba(255, 255, 255, 0.95);
  --toast-success: #48bb78;
  --toast-error: #e53e3e;
  --dropdown-bg: rgba(255, 255, 255, 0.95);
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg-color: #1a1a2e;
  --text-color: #e2e8f0;
  --text-muted: #a0aec0;
  --card-bg: rgba(30, 30, 60, 0.75);
  --card-border: rgba(255, 255, 255, 0.1);
  --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(102, 126, 234, 0.2);
  --input-bg: rgba(30, 30, 60, 0.9);
  --input-border: rgba(102, 126, 234, 0.3);
  --result-bg: rgba(30, 30, 60, 0.85);
  --result-border: rgba(102, 126, 234, 0.25);
  --overlay-bg: rgba(26, 26, 46, 0.6);
  --toast-bg: rgba(30, 30, 60, 0.95);
  --dropdown-bg: rgba(30, 30, 60, 0.95);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-color);
  color: var(--text-color);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}

.bg-animation {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1; overflow: hidden;
}

.bg-animation::before,
.bg-animation::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  animation: floatBlob 20s ease-in-out infinite;
}

.bg-animation::before {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(102,126,234,0.3) 0%, transparent 70%);
  top: -200px; left: -100px;
}

.bg-animation::after {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(118,75,162,0.25) 0%, transparent 70%);
  bottom: -150px; right: -100px;
  animation-delay: -10s;
}

@keyframes floatBlob {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(50px, -30px) scale(1.1); }
  50% { transform: translate(-20px, 40px) scale(0.95); }
  75% { transform: translate(30px, 20px) scale(1.05); }
}

.main-wrapper {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.top-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  position: relative;
  z-index: 100;
}

.lang-selector { position: relative; }

.lang-selector-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-color);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.lang-selector-btn:hover {
  background: var(--gradient-soft);
  border-color: var(--primary);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
}

.lang-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 180px;
  background: var(--dropdown-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 6px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: var(--transition);
  z-index: 200;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
}

.lang-dropdown.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.lang-option {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 14px;
  border: none;
  background: transparent;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-color);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  text-align: left;
}

.lang-option:hover { background: var(--gradient-soft); }

.lang-option.active {
  background: var(--gradient);
  color: white;
  font-weight: 600;
}

.lang-option.active:hover { background: var(--gradient); }

.theme-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  color: var(--text-color);
  cursor: pointer;
  transition: var(--transition);
  font-size: 18px;
}

.theme-toggle-btn:hover {
  background: var(--gradient-soft);
  border-color: var(--primary);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
}

.center-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.main-card {
  position: relative;
  width: 100%;
  max-width: 520px;
  background: var(--card-bg);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 40px 32px;
  box-shadow: var(--card-shadow);
  animation: cardAppear 0.6s ease-out;
  overflow: hidden;
}

.main-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--gradient);
}

@keyframes cardAppear {
  from { opacity: 0; transform: translateY(30px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.logo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}

.logo-icon {
  width: 64px; height: 64px;
  background: var(--gradient);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  font-size: 28px;
  color: white;
  box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
  animation: logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse {
  0%, 100% { box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35); }
  50% { box-shadow: 0 8px 32px rgba(102, 126, 234, 0.5); }
}

.logo-text {
  font-size: 28px;
  font-weight: 800;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.card-title {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-color);
  line-height: 1.3;
}

.card-subtitle {
  text-align: center;
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 28px;
  line-height: 1.5;
}

.input-group { position: relative; margin-bottom: 20px; }

.url-input {
  width: 100%;
  padding: 16px 48px 16px 20px;
  background: var(--input-bg);
  border: 2px solid var(--input-border);
  border-radius: 14px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text-color);
  transition: var(--transition);
  outline: none;
}

.url-input::placeholder { color: var(--text-muted); }

.url-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
}

.input-icon {
  position: absolute;
  right: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 18px;
  pointer-events: none;
}

.btn-group { margin-bottom: 4px; }

.btn {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 24px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.btn-primary {
  background: var(--gradient);
  color: var(--btn-text);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(102, 126, 234, 0.45);
}

.btn-primary:active { transform: translateY(0); }

.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  transform: scale(0);
  animation: rippleAnim 0.6s ease-out;
  pointer-events: none;
}

@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

.result-section {
  display: none;
  margin-top: 24px;
  animation: resultAppear 0.5s ease-out;
}

.result-section.show { display: block; }

@keyframes resultAppear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-divider {
  height: 1px;
  background: var(--gradient-soft);
  margin-bottom: 20px;
  border-radius: 1px;
}

.result-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.result-url {
  padding: 12px 16px;
  background: var(--input-bg);
  border: 1px solid var(--result-border);
  border-radius: 10px;
  font-size: 14px;
  word-break: break-all;
  margin-bottom: 12px;
}

.result-url a {
  color: var(--primary);
  text-decoration: none;
  transition: var(--transition);
}

.result-url a:hover {
  color: var(--primary-dark);
  text-decoration: underline;
}

.result-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.result-row .result-url { flex: 1; margin-bottom: 0; }

.btn-copy {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background: var(--gradient);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.btn-copy:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.btn-copy.copied {
  background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
}

.btn-download {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: var(--input-bg);
  color: var(--text-color);
  border: 1px solid var(--result-border);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.btn-download:hover {
  border-color: var(--primary);
  background: var(--gradient-soft);
  transform: translateY(-1px);
}

.result-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

.qr-display {
  display: flex;
  justify-content: center;
  padding: 20px;
  background: white;
  border-radius: 16px;
  margin-top: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
}

[data-theme="dark"] .qr-display { background: white; }

.qr-image {
  width: 220px; height: 220px;
  object-fit: contain;
  transition: transform 0.3s ease;
}

.qr-image:hover { transform: scale(1.05); }

.loading-overlay {
  position: absolute;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 50;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.loading-overlay.show {
  opacity: 1;
  visibility: visible;
}

.spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(102, 126, 234, 0.2);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 14px;
  font-weight: 500;
  color: var(--primary);
}

.toast-container {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: var(--toast-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-color);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
  animation: toastIn 0.4s ease-out;
  transition: var(--transition);
}

.toast.success { border-left: 4px solid var(--toast-success); }
.toast.error { border-left: 4px solid var(--toast-error); }

.toast.removing {
  opacity: 0;
  transform: translateX(100px);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(100px); }
  to { opacity: 1; transform: translateX(0); }
}

.footer {
  text-align: center;
  padding: 24px;
  font-size: 13px;
  color: var(--text-muted);
}

@media (max-width: 600px) {
  .main-card { padding: 32px 20px; border-radius: 20px; }
  .card-title { font-size: 19px; }
  .logo-icon { width: 56px; height: 56px; font-size: 24px; border-radius: 16px; }
  .logo-text { font-size: 24px; }
  .url-input { padding: 14px 44px 14px 16px; font-size: 14px; }
  .btn { padding: 14px 20px; font-size: 15px; }
  .result-row { flex-direction: column; }
  .result-row .result-url { width: 100%; }
  .result-actions { flex-direction: column; }
  .btn-copy, .btn-download { width: 100%; justify-content: center; }
  .qr-image { width: 180px; height: 180px; }
  .top-bar { padding: 12px 16px; }
  .toast-container { right: 12px; left: 12px; }
}

@media (max-width: 400px) {
  .main-card { padding: 24px 16px; }
  .card-title { font-size: 17px; }
  .card-subtitle { font-size: 13px; }
}
    </style>

// ============================================================
// Language System (no fetch - all inline)
// ============================================================
const LangSystem = {
  currentLang: 'vi',
  availableLangs: [
    { code: 'vi', name: 'Tiếng Việt', flag: '🇻🇳' },
    { code: 'en', name: 'English', flag: '🇬🇧' },
    { code: 'ja', name: '日本語', flag: '🇯🇵' },
    { code: 'ko', name: '한국어', flag: '🇰🇷' },
    { code: 'zh', name: '中文', flag: '🇨🇳' },
    { code: 'fr', name: 'Français', flag: '🇫🇷' },
    { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
    { code: 'es', name: 'Español', flag: '🇪🇸' }
  ],

  init() {
    const storedLang = localStorage.getItem('linkshort_lang');
    const browserLang = navigator.language.substring(0, 2);

    if (storedLang && LANGUAGES[storedLang]) {
      this.currentLang = storedLang;
    } else {
      const isAvailable = this.availableLangs.some(l => l.code === browserLang && LANGUAGES[browserLang]);
      this.currentLang = isAvailable ? browserLang : 'vi';
      localStorage.setItem('linkshort_lang', this.currentLang);
    }

    this.applyTranslations();
    this.updateLanguageButton();
    this.renderLanguageDropdown();
  },

  t(key) {
    return LANGUAGES[this.currentLang]?.[key] || key;
  },

  applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = this.t(key);
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      el.placeholder = this.t(key);
    });

    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      const key = el.getAttribute('data-i18n-title');
      el.title = this.t(key);
    });

    document.querySelectorAll('[data-i18n-meta]').forEach(el => {
      const key = el.getAttribute('data-i18n-meta');
      el.content = this.t(key);
    });
  },

  updateLanguageButton() {
    const btn = document.getElementById('langToggleBtn');
    if (!btn) return;
    const currentLangObj = this.availableLangs.find(l => l.code === this.currentLang);
    if (currentLangObj) {
      btn.innerHTML = '<span>' + currentLangObj.flag + '</span> <span>' + currentLangObj.name + '</span> <i class="fas fa-chevron-down"></i>';
    }
  },

  changeLanguage(langCode) {
    if (langCode === this.currentLang) {
      document.getElementById('langDropdown').classList.remove('show');
      return;
    }

    if (!LANGUAGES[langCode]) return;

    this.currentLang = langCode;
    localStorage.setItem('linkshort_lang', langCode);
    document.documentElement.setAttribute('lang', langCode);

    this.applyTranslations();
    this.updateLanguageButton();
    this.renderLanguageDropdown();

    const resultSection = document.getElementById('resultSection');
    if (resultSection && resultSection.classList.contains('show')) {
      App.renderResult();
    }

    Toast.show(this.t('toast_success'), 'success');
    document.getElementById('langDropdown').classList.remove('show');
  },

  renderLanguageDropdown() {
    const dropdown = document.getElementById('langDropdown');
    if (!dropdown) return;
    dropdown.innerHTML = this.availableLangs.map(lang => {
      return '<button class="lang-option ' + (lang.code === this.currentLang ? 'active' : '') + '" type="button" onclick="LangSystem.changeLanguage(\'' + lang.code + '\')"><span>' + lang.flag + '</span><span>' + lang.name + '</span></button>';
    }).join('');
  }
};

// ============================================================
// Toast Notification System
// ============================================================
const Toast = {
  container: null,
  init() {
    this.container = document.getElementById('toastContainer');
  },
  show(message, type, duration) {
    if (!this.container) return;
    type = type || 'success';
    duration = duration || 3000;
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    var icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
    toast.innerHTML = '<i class="fas ' + icon + '"></i> <span>' + message + '</span>';
    this.container.appendChild(toast);
    setTimeout(function() {
      toast.classList.add('removing');
      setTimeout(function() { toast.remove(); }, 300);
    }, duration);
  }
};

// ============================================================
// Ripple Effect
// ============================================================
const RippleEffect = {
  init() {
    document.querySelectorAll('.btn, .btn-copy, .btn-download, .lang-option, .theme-toggle-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        var ripple = document.createElement('span');
        var rect = btn.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        var x = e.clientX - rect.left - size / 2;
        var y = e.clientY - rect.top - size / 2;
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.className = 'ripple';
        btn.appendChild(ripple);
        setTimeout(function() { ripple.remove(); }, 600);
      });
    });
  }
};

const ThemeSystem = {
  currentTheme: 'light',
  init() {
    var stored = localStorage.getItem('linkshort_theme');
    if (stored) {
      this.currentTheme = stored;
    } else {
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      this.currentTheme = prefersDark ? 'dark' : 'light';
      localStorage.setItem('linkshort_theme', this.currentTheme);
    }
    this.applyTheme();
  },
  toggle() {
    this.currentTheme = this.currentTheme === 'light' ? 'dark' : 'light';
    localStorage.setItem('linkshort_theme', this.currentTheme);
    this.applyTheme();
  },
  applyTheme() {
    document.documentElement.setAttribute('data-theme', this.currentTheme);
    var icon = document.getElementById('themeIcon');
    if (icon) {
      icon.className = this.currentTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    }
  }
};

// ============================================================
// QR Generator (using davidshimjs/qrcodejs)
// ============================================================
const QRGenerator = {
  generatePNG: function(text, size) {
    size = size || 256;
    return new Promise(function(resolve, reject) {
      try {
        var tempDiv = document.createElement('div');
        tempDiv.style.display = 'none';
        document.body.appendChild(tempDiv);

        new QRCode(tempDiv, {
          text: text,
          width: size,
          height: size,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        setTimeout(function() {
          try {
            var canvas = tempDiv.querySelector('canvas');
            if (canvas) {
              var dataUrl = canvas.toDataURL('image/png');
              document.body.removeChild(tempDiv);
              resolve(dataUrl);
            } else {
              var img = tempDiv.querySelector('img');
              if (img && img.src) {
                document.body.removeChild(tempDiv);
                resolve(img.src);
              } else {
                document.body.removeChild(tempDiv);
                reject(new Error('QR render failed'));
              }
            }
          } catch (e) {
            document.body.removeChild(tempDiv);
            reject(e);
          }
        }, 100);
      } catch (e) {
        reject(e);
      }
    });
  },

  downloadPNG: function(text, filename) {
    filename = filename || 'qrcode';
    this.generatePNG(text, 512).then(function(dataUrl) {
      var link = document.createElement('a');
      link.download = filename + '.png';
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }).catch(function(e) {
      console.error('Download PNG error:', e);
    });
  },

  generateSVG: function(text, size) {
    size = size || 512;
    var tempDiv = document.createElement('div');
    tempDiv.style.display = 'none';
    document.body.appendChild(tempDiv);

    new QRCode(tempDiv, {
      text: text,
      width: size,
      height: size,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    return new Promise(function(resolve, reject) {
      setTimeout(function() {
        try {
          var canvas = tempDiv.querySelector('canvas');
          if (canvas) {
            var imageData = canvas.getContext('2d').getImageData(0, 0, size, size);
            var data = imageData.data;
            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
            svg += '<rect width="' + size + '" height="' + size + '" fill="#ffffff"/>';
            for (var y = 0; y < size; y++) {
              for (var x = 0; x < size; x++) {
                var idx = (y * size + x) * 4;
                if (data[idx] < 128) {
                  svg += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#000000"/>';
                }
              }
            }
            svg += '</svg>';
            document.body.removeChild(tempDiv);
            resolve(svg);
          } else {
            document.body.removeChild(tempDiv);
            reject(new Error('QR render failed'));
          }
        } catch (e) {
          document.body.removeChild(tempDiv);
          reject(e);
        }
      }, 100);
    });
  },

  downloadSVG: function(text, filename) {
    filename = filename || 'qrcode';
    this.generateSVG(text, 512).then(function(svg) {
      var blob = new Blob([svg], { type: 'image/svg+xml' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.download = filename + '.svg';
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }).catch(function(e) {
      console.error('Download SVG error:', e);
    });
  },

  renderToImage: function(imgElement, text, size) {
    size = size || 256;
    this.generatePNG(text, size).then(function(dataUrl) {
      imgElement.src = dataUrl;
      imgElement.alt = 'QR Code';
    }).catch(function(e) {
      console.error('QR render error:', e);
    });
  }
};

// ============================================================
// Copy to Clipboard
// ============================================================
const CopyHelper = {
  copy: function(text) {
    return new Promise(function(resolve) {
      try {
        navigator.clipboard.writeText(text).then(function() { resolve(true); }).catch(function() {
          var textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          var success = document.execCommand('copy');
          document.body.removeChild(textarea);
          resolve(success);
        });
      } catch (err) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        var success = document.execCommand('copy');
        document.body.removeChild(textarea);
        resolve(success);
      }
    });
  }
};

// ============================================================
// URL Validator
// ============================================================
function isValidURL(url) {
  try {
    var parsed = new URL(url);
    return parsed.protocol === 'http:' || parsed.protocol === 'https:';
  } catch (e) {
    return false;
  }
}

// ============================================================
// Main App Controller
// ============================================================
const App = {
  currentResult: null,

  init: function() {
    Toast.init();
    ThemeSystem.init();
    RippleEffect.init();
    this.bindEvents();
  },

  bindEvents: function() {
    document.getElementById('btnGenerate').addEventListener('click', function() { App.process(); });
    document.getElementById('themeToggle').addEventListener('click', function() { ThemeSystem.toggle(); });

    document.getElementById('langToggleBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      document.getElementById('langDropdown').classList.toggle('show');
    });

    document.addEventListener('click', function(e) {
      var dropdown = document.getElementById('langDropdown');
      var toggle = document.getElementById('langToggleBtn');
      if (!dropdown.contains(e.target) && !toggle.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    document.getElementById('urlInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        App.process();
      }
    });
  },

  process: function() {
    var input = document.getElementById('urlInput');
    var url = input.value.trim();

    if (!url) {
      Toast.show(LangSystem.t('toast_error_empty'), 'error');
      return;
    }

    if (!isValidURL(url)) {
      Toast.show(LangSystem.t('toast_error_url'), 'error');
      return;
    }

    this.showLoading(true);

    // Use TinyURL free API for shortening
    var self = this;
    var shortUrl = url;

    fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url))
      .then(function(response) {
        if (response.ok) return response.text();
        throw new Error('API failed');
      })
      .then(function(text) {
        if (text && text.indexOf('http') === 0) {
          shortUrl = text.trim();
        }
        self.finishProcess(url, shortUrl);
      })
      .catch(function(apiError) {
        console.warn('Shortening API failed, using original URL:', apiError);
        self.finishProcess(url, shortUrl);
      });
  },

  finishProcess: function(url, shortUrl) {
    var self = this;
    this.currentResult = {
      originalUrl: url,
      shortUrl: shortUrl
    };
    this.renderResult();
    this.showLoading(false);
  },

  showLoading: function(show) {
    var overlay = document.getElementById('loadingOverlay');
    if (show) {
      overlay.classList.add('show');
    } else {
      setTimeout(function() { overlay.classList.remove('show'); }, 300);
    }
  },

  renderResult: function() {
    if (!this.currentResult) return;

    var resultSection = document.getElementById('resultSection');
    var shortUrl = this.currentResult.shortUrl;
    var t = function(key) { return LangSystem.t(key); };

    var html = '<div class="result-divider"></div>';
    html += '<div class="result-label">' + t('result_shortened') + '</div>';
    html += '<div class="result-row">';
    html += '<div class="result-url"><a href="' + this.escapeHtml(shortUrl) + '" target="_blank" rel="noopener">' + this.escapeHtml(shortUrl) + '</a></div>';
    html += '<button class="btn-copy" id="btnCopyUrl" onclick="App.copyShortUrl()"><i class="fas fa-copy"></i> ' + t('btn_copy_short') + '</button>';
    html += '</div>';

    html += '<div class="qr-display">';
    html += '<img id="qrImage" class="qr-image" src="" alt="QR Code">';
    html += '</div>';

    html += '<div class="result-actions">';
    html += '<button class="btn-copy" onclick="App.copyShortUrl()"><i class="fas fa-copy"></i> ' + t('btn_copy_short') + '</button>';
    html += '<button class="btn-download" onclick="QRGenerator.downloadPNG(\'' + this.escapeHtml(shortUrl) + '\')"><i class="fas fa-download"></i> ' + t('btn_download_png') + '</button>';
    html += '<button class="btn-download" onclick="QRGenerator.downloadSVG(\'' + this.escapeHtml(shortUrl) + '\')"><i class="fas fa-download"></i> ' + t('btn_download_svg') + '</button>';
    html += '</div>';

    resultSection.innerHTML = html;
    resultSection.classList.add('show');

    // Generate QR image
    var qrImg = document.getElementById('qrImage');
    if (qrImg) {
      QRGenerator.renderToImage(qrImg, shortUrl, 256);
    }

    resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  },

  copyShortUrl: function() {
    var self = this;
    var text = this.currentResult ? this.currentResult.shortUrl : '';
    CopyHelper.copy(text).then(function(success) {
      if (success) {
        Toast.show(LangSystem.t('toast_copied'), 'success');
        var btns = document.querySelectorAll('.btn-copy');
        btns.forEach(function(btn) {
          btn.classList.add('copied');
          btn.innerHTML = '<i class="fas fa-check"></i> ' + LangSystem.t('toast_copied');
          setTimeout(function() {
            btn.classList.remove('copied');
            btn.innerHTML = '<i class="fas fa-copy"></i> ' + LangSystem.t('btn_copy_short');
          }, 2000);
        });
      }
    });
  },

  escapeHtml: function(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
};

// ============================================================
// Initialize on DOM Ready
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  LangSystem.init();
  App.init();
});
    </script>
</body>
</html>
